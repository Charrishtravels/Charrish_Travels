<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager · Charrish Travels</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Decap CMS's login screen, reskinned to match the site. Targets are
         partial-class matches since Decap's build hashes the class prefix. */
      [class*='StyledAuthenticationPage'] {
        background: #f5f6f4 !important;
        font-family: 'Inter', 'Segoe UI', sans-serif !important;
      }

      [class*='IconWrapper-DecapLogoIcon'] {
        display: none !important;
      }

      [class*='LoginButton'] {
        background-color: #0f3d3c !important;
        border: none !important;
        border-radius: 9999px !important;
        padding: 0.75rem 2.25rem !important;
        font-family: 'Inter', 'Segoe UI', sans-serif !important;
        font-weight: 600 !important;
        font-size: 0.875rem !important;
        letter-spacing: 0.02em !important;
        transition: background-color 0.2s ease !important;
      }

      [class*='LoginButton']:hover {
        background-color: #145654 !important;
      }

      .charrish-admin-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 2rem;
      }

      .charrish-admin-brand img {
        height: 44px;
        width: auto;
      }

      .charrish-admin-brand span {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #0f3d3c;
      }
    </style>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
    <script>
      function injectCharrishBrand() {
        var page = document.querySelector('[class*="StyledAuthenticationPage"]');
        if (!page || page.querySelector('.charrish-admin-brand')) return;
        var brand = document.createElement('div');
        brand.className = 'charrish-admin-brand';
        brand.innerHTML = '<img src="/images/logo.svg" alt="Charrish Travels" /><span>Charrish Travels</span>';
        page.insertBefore(brand, page.firstChild);
      }
      var charrishBrandObserver = new MutationObserver(injectCharrishBrand);
      charrishBrandObserver.observe(document.body, { childList: true, subtree: true });
      injectCharrishBrand();
    </script>
  </body>
</html>
