<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager · Charrish Travels</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      @font-face {
        font-family: 'Redaction';
        src: url('/fonts/Redaction-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* Decap CMS's login screen, reskinned to match the site. Targets are
         partial-class matches since Decap's build hashes the class prefix.
         The logo image itself is Decap's own native rendering of our
         config.yml `logo.src` — no need to hide/replace it, just brand
         everything around it. */
      [class*='StyledAuthenticationPage'] {
        background: #fbf9f4 !important;
        font-family: 'Geist', 'Segoe UI', sans-serif !important;
      }

      [class*='LoginButton'] {
        background-color: #002d07 !important;
        border: none !important;
        border-radius: 9999px !important;
        padding: 0.75rem 2.25rem !important;
        font-family: 'Geist', 'Segoe UI', sans-serif !important;
        font-weight: 600 !important;
        font-size: 0.875rem !important;
        letter-spacing: 0.02em !important;
        transition: background-color 0.2s ease !important;
      }

      [class*='LoginButton']:hover {
        background-color: #01450c !important;
      }

      .charrish-admin-brand {
        margin-bottom: 0.5rem;
      }

      .charrish-admin-brand span {
        font-family: 'Redaction', Georgia, serif;
        font-size: 1.05rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #002d07;
      }

      /* Header, once logged in: hide the quick-add dropdown, style our
         injected Packages/Reviews links. Content/Media/Workflow tabs
         are hidden via JS below since they share a class with each other. */
      [class*='AppHeaderQuickNewButton'] {
        display: none !important;
      }

      /* Collection list page: hide the "Collections" side panel (nav links
         in the header cover switching collections now) and reclaim the
         280px of left padding the entries column reserved for it. */
      [class*='SidebarContainer'] {
        display: none !important;
      }

      [class*='CollectionMain'] {
        padding-left: 0 !important;
      }

      .charrish-admin-nav-link {
        display: inline-flex;
        align-items: center;
        padding: 16px 20px;
        font-family: 'Geist', 'Segoe UI', sans-serif !important;
        font-size: 16px;
        font-weight: 500;
        color: #7b8290;
        text-decoration: none;
      }

      .charrish-admin-nav-link:hover {
        color: #002d07;
      }
    </style>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        // Only redirect to the Manage hub on a bare landing (no deep link).
        // Editing a specific entry loads this page fresh with a
        // #/collections/.../entries/... hash — redirecting unconditionally
        // would wipe that out before Decap ever reads it.
        var hasDeepLink = /^#\/./.test(window.location.hash);
        window.netlifyIdentity.on('init', (user) => {
          if (user) {
            if (!hasDeepLink) document.location.href = '/admin/manage';
          } else {
            window.netlifyIdentity.on('login', () => {
              if (!hasDeepLink) document.location.href = '/admin/manage';
            });
          }
        });
      }
    </script>
    <script>
      function injectCharrishBrand() {
        var page = document.querySelector('[class*="StyledAuthenticationPage"]');
        if (!page || page.querySelector('.charrish-admin-brand')) return;
        var brand = document.createElement('div');
        brand.className = 'charrish-admin-brand';
        brand.innerHTML = '<span>Charrish Travels</span>';
        page.insertBefore(brand, page.firstChild);
      }

      function injectCharrishAdminNav() {
        var navList = document.querySelector('header nav ul');
        if (!navList || navList.querySelector('.charrish-admin-nav-link')) return;

        var contentLi = null;
        Array.prototype.forEach.call(navList.children, function (li) {
          var control = li.querySelector('a, button');
          if (!control) return;
          var label = control.textContent.trim();
          if (label === 'Contents' || label === 'Media' || label === 'Workflow') {
            li.style.display = 'none';
            if (label === 'Contents') contentLi = li;
          }
        });

        [
          { label: 'Packages', href: '/admin/packages' },
          { label: 'Reviews', href: '/admin/reviews' },
        ].forEach(function (link) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = link.href;
          a.textContent = link.label;
          a.className = 'charrish-admin-nav-link';
          li.appendChild(a);
          if (contentLi) navList.insertBefore(li, contentLi);
          else navList.appendChild(li);
        });
      }

      function injectCharrish() {
        injectCharrishBrand();
        injectCharrishAdminNav();
      }
      var charrishBrandObserver = new MutationObserver(injectCharrish);
      charrishBrandObserver.observe(document.body, { childList: true, subtree: true });
      injectCharrish();
    </script>
  </body>
</html>
